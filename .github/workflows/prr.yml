name: prr-lab
on:
  pull_request_review:
    types: [submitted]
permissions:
  pull-requests: write
jobs:
  review-run:
    runs-on: ubuntu-latest
    steps:
      - name: checkout default ref
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: show ref and run PR code
        run: |
          echo "GITHUB_REF=$GITHUB_REF GITHUB_SHA=$GITHUB_SHA"
          echo "PWNHAVEN_PRREVIEW_CANARY_START"
          python3 pr_code.py
          echo "PWNHAVEN_PRREVIEW_CANARY_END"
